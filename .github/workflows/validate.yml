name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -x --tb=short
      - run: uv run ty check scripts tests
      - run: uv run python scripts/skill_bundle.py skills/document-extraction --output dist/document-extraction.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: document-extraction
          path: dist/document-extraction.zip
          if-no-files-found: error
